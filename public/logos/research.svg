<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Coding Moves Research logo">
  <title>Coding Moves Research</title>
  <defs>
    <linearGradient id="research-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233F"/>
      <stop offset="1" stop-color="#060B16"/>
    </linearGradient>
    <linearGradient id="research-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5D0FE" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#C026D3" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="research-shine">
      <stop offset="0" stop-color="#fff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="research-face" x1="116" y1="130" x2="332" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5D0FE"/>
      <stop offset=".45" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#701A75"/>
    </linearGradient>
    <linearGradient id="research-chev" x1="300" y1="0" x2="404" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0ABFC"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="research-badge" x1="0" y1="-70" x2="0" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#701A75"/>
    </linearGradient>
    <filter id="research-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#research-tile)"/>
  <rect x="9.5" y="9.5" width="493" height="493" rx="114.5" fill="none" stroke="url(#research-rim)" stroke-width="3"/>
  <ellipse cx="256" cy="70" rx="210" ry="90" fill="url(#research-shine)"/>
  <g transform="translate(244 244) scale(.84) translate(-262 -262)">
    <!-- soft glow behind the mark -->
    <path d="M332,193 L224,130 L116,193 L116,319 L224,382 L332,319" fill="none" stroke="#C026D3" stroke-opacity=".45" stroke-width="64" filter="url(#research-glow)"/>
    <!-- 3D extrusion (the "side" of the block) -->
    <path d="M332,193 L224,130 L116,193 L116,319 L224,382 L332,319" transform="translate(9 13)" fill="none" stroke="#701A75" stroke-width="58" stroke-linejoin="miter"/>
    <path d="M300,214 L342,256 L300,298" transform="translate(6 9)" fill="none" stroke="#701A75" stroke-width="30" stroke-linejoin="miter"/>
    <path d="M362,214 L404,256 L362,298" transform="translate(6 9)" fill="none" stroke="#701A75" stroke-width="30" stroke-linejoin="miter"/>
    <!-- front face -->
    <path d="M332,193 L224,130 L116,193 L116,319 L224,382 L332,319" fill="none" stroke="url(#research-face)" stroke-width="58" stroke-linejoin="miter"/>
    <!-- top highlight line for the metallic edge -->
    <path d="M318,185 L224,130 L130,185" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-linejoin="miter" transform="translate(0 -24)"/>
    <path d="M300,214 L342,256 L300,298" fill="none" stroke="url(#research-chev)" stroke-width="30" stroke-linejoin="miter"/>
    <path d="M362,214 L404,256 L362,298" fill="none" stroke="url(#research-chev)" stroke-width="30" stroke-linejoin="miter"/>
  </g>
  <g transform="translate(388 388)">
    <circle r="86" fill="#0A1222"/>
    <circle r="70" fill="url(#research-badge)"/>
    <circle r="70" fill="none" stroke="#F5D0FE" stroke-opacity=".55" stroke-width="3"/>
    <g transform="translate(-30 -30) scale(1.25)" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 12c-5-4-12-4-18-2v28c6-2 13-2 18 2 5-4 12-4 18-2V10c-6-2-13-2-18 2z"/><path d="M24 12v28"/></g>
  </g>
</svg>
