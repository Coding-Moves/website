<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Coding Moves Products logo">
  <title>Coding Moves Products</title>
  <defs>
    <linearGradient id="products-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233F"/>
      <stop offset="1" stop-color="#060B16"/>
    </linearGradient>
    <linearGradient id="products-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDD6FE" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#8B5CF6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="products-shine">
      <stop offset="0" stop-color="#fff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="products-face" x1="116" y1="130" x2="332" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDD6FE"/>
      <stop offset=".45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="products-chev" x1="300" y1="0" x2="404" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="products-badge" x1="0" y1="-70" x2="0" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <filter id="products-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <g transform="translate(244 244) scale(.84) translate(-262 -262)">
    <!-- soft glow behind the mark -->
    <path d="M332,193 L224,130 L116,193 L116,319 L224,382 L332,319" fill="none" stroke="#8B5CF6" stroke-opacity=".45" stroke-width="64" filter="url(#products-glow)"/>
    <!-- 3D extrusion (the "side" of the block) -->
    <path d="M332,193 L224,130 L116,193 L116,319 L224,382 L332,319" transform="translate(9 13)" fill="none" stroke="#4C1D95" stroke-width="58" stroke-linejoin="miter"/>
    <path d="M300,214 L342,256 L300,298" transform="translate(6 9)" fill="none" stroke="#4C1D95" stroke-width="30" stroke-linejoin="miter"/>
    <path d="M362,214 L404,256 L362,298" transform="translate(6 9)" fill="none" stroke="#4C1D95" stroke-width="30" stroke-linejoin="miter"/>
    <!-- front face -->
    <path d="M332,193 L224,130 L116,193 L116,319 L224,382 L332,319" fill="none" stroke="url(#products-face)" stroke-width="58" stroke-linejoin="miter"/>
    <!-- top highlight line for the metallic edge -->
    <path d="M318,185 L224,130 L130,185" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-linejoin="miter" transform="translate(0 -24)"/>
    <path d="M300,214 L342,256 L300,298" fill="none" stroke="url(#products-chev)" stroke-width="30" stroke-linejoin="miter"/>
    <path d="M362,214 L404,256 L362,298" fill="none" stroke="url(#products-chev)" stroke-width="30" stroke-linejoin="miter"/>
  </g>
  <g transform="translate(388 388)">
    <circle r="86" fill="none"/>
    <circle r="70" fill="url(#products-badge)"/>
    <circle r="70" fill="none" stroke="#DDD6FE" stroke-opacity=".55" stroke-width="3"/>
    <g transform="translate(-30 -30) scale(1.25)" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5 41 14v20L24 43 7 34V14z"/><path d="M7 14l17 9 17-9"/><path d="M24 23v20"/></g>
  </g>
</svg>
