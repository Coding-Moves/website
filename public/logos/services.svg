<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Coding Moves Services logo">
  <title>Coding Moves Services</title>
  <defs>
    <linearGradient id="services-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233F"/>
      <stop offset="1" stop-color="#060B16"/>
    </linearGradient>
    <linearGradient id="services-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#F59E0B" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="services-shine">
      <stop offset="0" stop-color="#fff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="services-face" x1="116" y1="130" x2="332" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset=".45" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="services-chev" x1="300" y1="0" x2="404" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="services-badge" x1="0" y1="-70" x2="0" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#9A3412"/>
    </linearGradient>
    <filter id="services-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#services-tile)"/>
  <rect x="9.5" y="9.5" width="493" height="493" rx="114.5" fill="none" stroke="url(#services-rim)" stroke-width="3"/>
  <ellipse cx="256" cy="70" rx="210" ry="90" fill="url(#services-shine)"/>
  <g transform="translate(244 244) scale(.84) translate(-262 -262)">
    <!-- soft glow behind the mark -->
    <path d="M332,193 L224,130 L116,193 L116,319 L224,382 L332,319" fill="none" stroke="#F59E0B" stroke-opacity=".45" stroke-width="64" filter="url(#services-glow)"/>
    <!-- 3D extrusion (the "side" of the block) -->
    <path d="M332,193 L224,130 L116,193 L116,319 L224,382 L332,319" transform="translate(9 13)" fill="none" stroke="#9A3412" stroke-width="58" stroke-linejoin="miter"/>
    <path d="M300,214 L342,256 L300,298" transform="translate(6 9)" fill="none" stroke="#9A3412" stroke-width="30" stroke-linejoin="miter"/>
    <path d="M362,214 L404,256 L362,298" transform="translate(6 9)" fill="none" stroke="#9A3412" stroke-width="30" stroke-linejoin="miter"/>
    <!-- front face -->
    <path d="M332,193 L224,130 L116,193 L116,319 L224,382 L332,319" fill="none" stroke="url(#services-face)" stroke-width="58" stroke-linejoin="miter"/>
    <!-- top highlight line for the metallic edge -->
    <path d="M318,185 L224,130 L130,185" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-linejoin="miter" transform="translate(0 -24)"/>
    <path d="M300,214 L342,256 L300,298" fill="none" stroke="url(#services-chev)" stroke-width="30" stroke-linejoin="miter"/>
    <path d="M362,214 L404,256 L362,298" fill="none" stroke="url(#services-chev)" stroke-width="30" stroke-linejoin="miter"/>
  </g>
  <g transform="translate(388 388)">
    <circle r="86" fill="#0A1222"/>
    <circle r="70" fill="url(#services-badge)"/>
    <circle r="70" fill="none" stroke="#FDE68A" stroke-opacity=".55" stroke-width="3"/>
    <g transform="translate(-30 -30) scale(1.25)" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="15" width="36" height="25" rx="5"/><path d="M17 15v-4a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v4"/><path d="M6 26h36"/></g>
  </g>
</svg>
