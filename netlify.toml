[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/products"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/products/*"
  to = "/services/"
  status = 301

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
