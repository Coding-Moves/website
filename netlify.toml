[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Existing static pages shadow this rule. Unknown paths keep their brand's 404.
[[redirects]]
  from = "/:brand/*"
  to = "/:brand/404/"
  status = 404

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
